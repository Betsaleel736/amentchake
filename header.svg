<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-label="Amen Tchake, AI student and developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
 <defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F1B33"/><stop offset="1" stop-color="#1E3A8A"/></linearGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#7F9BFF" opacity=".35"/></pattern>
  <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2B134" stop-opacity="0"/><stop offset="1" stop-color="#F2B134" stop-opacity=".55"/></linearGradient>
 </defs>
 <rect width="1000" height="240" fill="url(#bg)"/>
 <rect width="1000" height="240" fill="url(#dots)"/>
 <circle cx="130" cy="60" r="70" fill="none" stroke="#7F9BFF" stroke-opacity=".35" stroke-width="1.5">
  <animate attributeName="cy" values="60;80;60" dur="6s" repeatCount="indefinite"/></circle>
 <circle cx="880" cy="170" r="46" fill="#F2B134" fill-opacity=".25">
  <animate attributeName="cy" values="170;140;170" dur="5s" repeatCount="indefinite"/></circle>
 <circle cx="820" cy="50" r="18" fill="none" stroke="#7F9BFF" stroke-width="3" stroke-opacity=".6">
  <animate attributeName="r" values="18;26;18" dur="4s" repeatCount="indefinite"/></circle>
 <!-- scan beam sweeping across -->
 <rect x="0" y="0" width="90" height="240" fill="url(#beam)" opacity=".5" transform="rotate(0)">
  <animateTransform attributeName="transform" type="translate" values="-120 0;1100 0" dur="4.5s" repeatCount="indefinite"/></rect>
 <!-- face-detection brackets around the name -->
 <g stroke="#F2B134" stroke-width="4" fill="none" stroke-linecap="square">
  <path d="M110 62 h-28 v28"><animate attributeName="stroke-opacity" values="1;.3;1" dur="2.4s" repeatCount="indefinite"/></path>
  <path d="M890 62 h28 v28"><animate attributeName="stroke-opacity" values="1;.3;1" dur="2.4s" repeatCount="indefinite"/></path>
  <path d="M110 178 h-28 v-28"><animate attributeName="stroke-opacity" values="1;.3;1" dur="2.4s" repeatCount="indefinite"/></path>
  <path d="M890 178 h28 v-28"><animate attributeName="stroke-opacity" values="1;.3;1" dur="2.4s" repeatCount="indefinite"/></path>
 </g>
 <text x="500" y="124" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="64" font-weight="800" fill="#fff" letter-spacing="-1">Amen Tchake
  <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/></text>
 <text x="500" y="166" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="22" fill="#B9C4E0">AI Student · Computer Vision · Front-End Developer
  <animate attributeName="opacity" values="0;0;1" keyTimes="0;.5;1" dur="2s" fill="freeze"/></text>
 <text x="500" y="204" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="14" fill="#F2B134">Face matched: Amen
  <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.2;.3;.9;1" dur="4.5s" repeatCount="indefinite"/></text>
</svg>
